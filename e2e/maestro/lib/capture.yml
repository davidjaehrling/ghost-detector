# Viewfinder to result: CAPTURE, the scan runs (6 to 10 s, up to 12 s when extended), the result opens.
appId: com.ghostdetector.app
---
- tapOn:
    id: key-capture
- extendedWaitUntil:
    visible:
      id: screen-scan
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: screen-result
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
